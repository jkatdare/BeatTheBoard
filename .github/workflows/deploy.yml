# Deploy to Azure Container Apps on every push to main.
#
# What happens, top to bottom:
#   1. GitHub checks out the commit you just pushed.
#   2. It logs into Azure using AZURE_CREDENTIALS -- a repo secret holding a
#      service principal (a robot login) that can only touch beattheboard-rg.
#   3. `az acr build` sends the repo to Azure Container Registry, which builds
#      the image from the Dockerfile in the cloud (no Docker on the runner).
#      The image is tagged with the commit hash, so every deploy is traceable.
#   4. `az containerapp update --image` points the app at the new image, which
#      creates a new revision and shifts traffic to it.
#
# The `paths` filter means a push that only touches check.py, the memos or the
# README does not trigger a rebuild -- only the files that go into the image.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - engine.py
      - njt_logger.py
      - codebook.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  workflow_dispatch:        # also allows "Run workflow" by hand from the Actions tab

env:
  APP: beattheboard
  RG: beattheboard-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR and roll the app to it
        run: |
          set -e
          az config set extension.use_dynamic_install=yes_without_prompt
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          TAG="$ACR.azurecr.io/$APP:${GITHUB_SHA::12}"
          echo "building $TAG"
          az acr build --registry "$ACR" --image "$APP:${GITHUB_SHA::12}" .
          az containerapp update --name "$APP" --resource-group "$RG" --image "$TAG"
          echo "deployed: https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
